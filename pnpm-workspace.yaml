engineStrict: true
sideEffectsCache: false
# Refuse npm versions published less than 24h ago — the window in which most
# compromised releases (e.g. Shai-Hulud-style worms) are detected and unpublished.
minimumReleaseAge: 1440

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.0
  '@types/node': ^24
  body-parser: 1.20.9
  effect: 3.21.2
  # PR #40, 2026-05-27: keep toolchain consumers on a known-good current glob 13 release.
  # Re-evaluate after the next dependency compatibility pass confirms the override is no longer needed.
  glob: 13.0.6
  http-proxy-middleware: 3.0.7
  # better-auth 1.6.13 advertises kysely 0.29 support, but its kysely adapter
  # still imports root migration constants removed at runtime in kysely 0.29.
  kysely: 0.28.17
  qs: 6.15.2
  'react-cosmos>ws': 8.21.0
  shell-quote: 1.12.0
  svgo: 4.1.0
  'testcontainers>undici': 7.30.1
  # 2026-11-02 security pass: patched releases within each consumer's major line.
  '@grpc/grpc-js@<1.14.5': ^1.14.7
  'brace-expansion@<1.1.20': ^1.1.21
  'brace-expansion@>=2.0.0 <2.1.6': ^2.1.7
  'brace-expansion@>=3.0.0 <5.0.11': ^5.0.12
  'browserslist@<4.28.7': ^4.29.5
  'engine.io@>=6.6.0 <6.6.10': ^6.6.11
  'esbuild@>=0.27.3 <0.28.1': ^0.28.1
  'fast-uri@>=3.0.0 <3.1.7': ^3.1.9
  'follow-redirects@<1.16.2': ^1.16.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'launch-editor@<2.14.2': ^2.14.2
  'nanoid@<3.3.18': ^3.3.20
  'postcss@<8.5.18': ^8.5.32
  'proxy-addr@<2.0.8': ^2.0.8
  'seroval@<1.6.8': ^1.6.8
  'smol-toml@<1.7.1': ^1.9.1
  'socket.io-parser@>=4.0.0 <4.2.7': ^4.2.7
  'source-map-js@<1.2.2': ^1.2.2
  'tinypool@<2.1.2': ^2.2.0
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'zod@>=4.0.0 <4.6.6': ^4.6.7

peerDependencyRules:
  allowedVersions:
    '@tanstack/zod-adapter>zod': '4'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': false
  '@tailwindcss/oxide': true
  bufferutil: false
  cbor-extract: false
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
