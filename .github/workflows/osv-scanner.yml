name: OSV Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-pr:
    name: Scan PR Diff
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      contents: read
      # Required to read the Actions run for SARIF correlation.
      actions: read
      # Required to upload SARIF results to the Security tab.
      security-events: write
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
