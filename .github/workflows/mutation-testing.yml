name: Mutation Testing

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  critical:
    name: Stryker (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: [auth, kernel, user, shared]
    env:
      SKIP_ENV_VALIDATION: true
      VITE_BASE_URL: http://localhost:3000
      VITE_S3_BUCKET_URL: http://localhost:9000/default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24

      - name: Run scoped mutation tests
        run: pnpm test:mutation:${{ matrix.scope }}

      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.scope }}
          path: |
            reports/mutation/${{ matrix.scope }}/
            reports/stryker-incremental/${{ matrix.scope }}.json
          if-no-files-found: ignore
          retention-days: 30
