name: Supply Chain Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required for actions/attest-build-provenance to create attestations.
  attestations: write
  contents: read
  # Required for OIDC token signing of provenance attestations.
  id-token: write

jobs:
  artifacts:
    name: SBOM, Audit, and Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24

      - name: Run dependency audit
        id: dependency-audit
        continue-on-error: true
        run: pnpm audit --audit-level=high --json > pnpm-audit.json

      - name: Run TanStack lockfile policy
        run: pnpm security:tanstack

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
          upload-artifact: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          path: .
          upload-artifact: false

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-artifacts
          path: |
            pnpm-audit.json
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90

      - name: Attest supply-chain artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pnpm-audit.json
            sbom.spdx.json
            sbom.cdx.json

      - name: Fail on dependency audit findings
        if: steps.dependency-audit.outcome == 'failure'
        run: |
          echo "pnpm audit reported high-severity vulnerabilities; see pnpm-audit.json in the uploaded artifact."
          exit 1
